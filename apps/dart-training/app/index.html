<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Arial,sans-serif}main{max-width:600px;margin:auto;padding:16px 15px 36px}h1{font-size:23px;margin:4px 0}h2{font-size:23px;margin:7px 0 14px}h3{font-size:18px;margin:8px 0}small,.muted{color:var(--dim)}p{line-height:1.45}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 18px}header strong{color:var(--orange);letter-spacing:.6px}header small{display:block;font-size:12px;margin-top:3px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 20px}button,select,input{font:inherit}button{border:1px solid #62768a;border-radius:11px;background:#304457;color:white;padding:14px 12px;font-weight:700;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.34;cursor:not-allowed}.primary{background:var(--green);border-color:var(--green)}.accent{background:#965220;border-color:#bd7035}.small{padding:10px 12px;font-size:13px}nav button{min-width:0;padding:11px 2px;font-size:14px}nav button.active{border-color:var(--orange);color:var(--orange);background:#35291e}.row{display:flex;gap:9px;flex-wrap:wrap}.row>button{flex:1;min-width:110px}.card{background:var(--surface);border:1px solid #3a5064;border-radius:15px;padding:17px;margin:13px 0}.metric{font-size:42px;font-weight:800;line-height:1.12;margin:8px 0}.pill{border:1px solid #566b80;border-radius:30px;padding:5px 9px;font-size:12px;color:var(--dim);display:inline-block;margin:2px}.status{font-size:13px;color:#bed0e0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{background:#152331;border:1px solid #33495e;border-radius:12px;padding:12px}.tile .big{font-size:25px;font-weight:800;margin-top:6px;overflow-wrap:anywhere}.tile small{display:block;font-size:12px}input,select{display:block;width:100%;background:#101a25;border:1px solid #657a8c;color:#fff;border-radius:10px;padding:12px;margin:6px 0 13px}label{font-size:14px;font-weight:650}hr{border:0;border-top:1px solid #46596c;margin:17px 0}.list{margin:8px 0 0;padding-left:18px}.list li{padding:5px 0}details{border-top:1px solid #485f71;padding:11px 0}summary{cursor:pointer;font-weight:650}.good{color:#66dfb0}.bad{color:#fca997}.warn{border-left:4px solid var(--orange);padding:10px 12px;background:#302c2a;font-size:14px;line-height:1.5;border-radius:5px;margin:11px 0}.chart{width:100%;height:auto;display:block}.bar{height:12px;background:#344c60;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange)}.statrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.statrow span{flex:0 0 95px}.statrow .bar{flex:1}.statrow b{flex:0 0 56px;text-align:right;font-size:13px}#notices{font-size:13px;color:#ffce7f;min-height:10px}#fileImport{margin-bottom:8px}#fileImport::file-selector-button{font:inherit;cursor:pointer}.mutedbox{background:#152432;border-radius:10px;padding:12px;color:#bed0e0;font-size:13px;line-height:1.5}.caption{font-size:12px;color:var(--dim)}
/* Compact, reliable 501 entry without the mobile OS keyboard. */
.scoreboard501{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:7px;align-items:stretch;margin:8px 0 10px}
.scoreboard501>div{min-width:0;background:#152331;border:1px solid #344d61;border-radius:12px;padding:9px;text-align:center}
.scoreboard501 .remaining{font-size:40px;font-weight:850;line-height:1.15;color:white}
.scoreboard501 small{display:block;font-size:11px;margin-bottom:3px}
.scoreboard501 .smallmetric{font-size:21px;font-weight:850;margin-top:7px;font-variant-numeric:tabular-nums}
.scoreinput501{width:100%;margin:2px 0 6px;text-align:center;font-size:34px;font-weight:850;padding:8px 12px;line-height:1.15;letter-spacing:1px;caret-color:transparent}
.scoreinput501[readonly]{cursor:default}
.scoreOptions501{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:6px}
.scoreOptions501 button{min-width:0;min-height:44px;padding:8px 2px;font-size:20px}
.scoreOptions501 button.chosen{border-color:var(--orange);background:#794822;color:white}
.finish501{margin:9px 0;background:#1b3940;border:1px solid #46796a;border-radius:10px;padding:10px}
.finish501 .scoreOptions501{grid-template-columns:repeat(3,minmax(0,1fr))}
#score501Preview{min-height:24px;font-size:13px;color:#c8d7e5;margin:8px 0 4px}
#save501:disabled{opacity:.45}
.card-501{padding:12px;margin:9px 0}
.card-501 hr{margin:11px 0}
.card-501>h3{margin:5px 0}
@media(max-width:380px){main{padding:10px 10px 25px}.scoreboard501 .remaining{font-size:35px}.scoreOptions501 button{min-height:41px}}

/* v7.3: thumb-friendly controls across all six games, no change to scoring rules. */
main{max-width:560px;padding:12px 13px 32px}
header{margin:0 0 8px}header small{font-size:11px}
nav{grid-template-columns:repeat(4,minmax(0,1fr));position:sticky;top:0;z-index:5;background:var(--bg);padding:7px 0;margin:0 0 12px;gap:5px}
nav button{min-width:0;min-height:47px;font-size:14px;padding:8px 3px;border-radius:11px}
.card{padding:14px;margin:10px 0}
h2{font-size:22px;margin:7px 0 9px}
.exercise-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--dim);font-size:13px}
.stepbar{display:flex;gap:4px;margin:9px 0 14px}.stepbar i{height:5px;background:#354c60;flex:1;border-radius:4px}.stepbar i.done{background:#2aab7c}.stepbar i.current{background:var(--orange)}
.game-info{margin:7px 0}.game-info summary{font-size:13px;font-weight:650;color:var(--dim)}.game-info p{font-size:13px;margin:7px 0 3px;color:var(--dim)}
.game-title{font-size:20px;margin:4px 0 5px}.game-card{margin:9px 0}
.game-card .metric{font-size:58px;line-height:1.1;margin:8px 0}
.game-card .game-status{margin:5px 0;color:var(--dim);font-size:14px}
.play-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.play-actions button{min-width:0;min-height:78px;font-size:22px;padding:12px 4px;border-radius:14px}
.play-actions button.primary{background:#16845c}
.play-actions button:not(.primary){background:#3c5064}
.scoring-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:15px}
.scoring-actions button{min-width:0;min-height:66px;font-size:16px;padding:8px 6px;line-height:1.2}
.scoring-actions button:last-child{grid-column:1/-1}
.scoring-actions button strong{display:block;font-size:25px;line-height:1.3}
.completed-game{text-align:center;padding:18px 0 10px}.completed-game .metric{font-size:42px}
.game-footer{display:grid;grid-template-columns:1fr;gap:7px;margin-top:10px}
.game-footer button.next{min-height:60px;font-size:18px}
.game-footer button.next:disabled{min-height:50px;opacity:.35}
.game-footer .secondary-actions{display:flex;justify-content:space-between;gap:10px}
.game-footer .secondary-actions button{min-width:0;font-size:13px;min-height:42px;flex:1}
.scoreboard501{margin-top:4px}.scoreboard501 .remaining{font-size:42px}
.scoreinput501{margin:5px 0 8px;font-size:29px;min-height:51px}
.scoreOptions501 button{min-height:49px}
#score501Preview{margin:10px 0}
.card-501{padding:12px}.card-501 .game-footer{margin-top:5px}
.backup-banner{padding:11px;background:#152432;border-radius:10px;margin:11px 0;font-size:13px;color:var(--dim)}
.backup-banner button{padding:7px 10px;font-size:13px;margin-top:7px}
@media(max-width:380px){.game-card .metric{font-size:52px}.scoreboard501 .remaining{font-size:37px}.play-actions button{min-height:73px}nav button{font-size:13px}}

/* v7.4: historical dart journal. Display-only: original storage and games remain unchanged. */
.journal-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.journal-top h2{margin:6px 0}.journal-action{width:100%;min-height:50px;margin-top:10px}
.journal-entry{margin:9px 0;padding:14px}.journal-entry .journal-summary{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.journal-date{font-weight:800;font-size:20px}.journal-tags{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 0}
.journal-tags span{border:1px solid #496477;border-radius:8px;padding:6px 8px;font-size:12px;color:#d4e2ec}
.journal-tags span.good{border-color:#2d8565;color:#73e9b7}
.journal-headline{border-radius:11px;background:#132433;border:1px solid #364e60;padding:12px;margin-top:10px}
.journal-headline p{margin:5px 0}.journal-exercise{margin:9px 0;padding:12px;background:var(--surface);border:1px solid #3a5064;border-radius:13px}
.journal-exercise summary{display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none;min-height:45px}
.journal-exercise summary::-webkit-details-marker{display:none}.journal-exercise summary:after{content:'▾';margin-left:6px;color:var(--orange)}
.journal-exercise[open] summary:after{content:'▴'}
.journal-exercise summary>span{flex:1;min-width:0}.journal-exercise .detail-content{padding-top:11px;border-top:1px solid #405466;margin-top:9px}
.journal-exercise .detail-content p{margin:6px 0}.journal-kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.journal-kpi>div{background:#142533;border:1px solid #34485b;border-radius:10px;padding:10px}
.journal-kpi small{display:block}.journal-kpi strong{font-size:21px;display:block;margin-top:5px;overflow-wrap:anywhere}
.journal-delta{font-size:13px;color:var(--dim);margin:8px 0}.journal-delta.good{color:#78e3b5}.journal-delta.bad{color:#ffafa6}
.journal-select{margin-top:9px}.journal-empty{color:var(--dim);font-size:14px;line-height:1.5}
.journal-focus{border-left:4px solid var(--orange);background:#242c32;padding:12px 14px;border-radius:9px;margin:12px 0}
.journal-focus p{font-size:14px;margin:8px 0}.journal-focus p:last-child{margin-bottom:0}
.journal-micro{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.journal-micro span{font-size:12px;padding:6px 7px;border:1px solid #4b5f72;border-radius:8px}
@media(max-width:380px){.journal-date{font-size:17px}.journal-entry{padding:11px}.journal-exercise{padding:10px}}

/* v8: a single automatically selected day's programme, and saved partials. */
.program-entry{border-top:1px solid #3d5467;padding:11px 0}
.program-entry small{display:block;color:var(--dim);line-height:1.5;font-size:12px;margin-top:3px}
.program-rest{border-top:1px solid #42586b;padding:14px 0 2px;font-size:13px;color:#bcd1df}
.game-footer .secondary-actions{flex-wrap:wrap}
.game-footer .secondary-actions button{min-width:31%}

/* v8.4: social cards are rendered from stored results only (offline; no third party). */
.share-section{border:1px solid #8a5b2c;background:linear-gradient(160deg,#203346,#142333);padding:14px 13px 18px;border-radius:16px;margin:4px 0 18px;box-shadow:0 5px 26px #0005}
.share-section h2{margin:3px 0 5px}.share-section .subtle{color:#b9cbd8;font-size:13px;line-height:1.45;margin:0 0 12px}
.share-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.share-switch button{min-width:0;padding:11px 6px}.share-switch .chosen{border:2px solid #ff9d42;background:#493322;color:#ffc28f}
.share-section label{font-size:13px}.share-section select{margin:6px 0 10px;padding:10px}
.share-preview{background:#0b1625;border:1px solid #4b6278;border-radius:12px;overflow:hidden;max-width:330px;margin:12px auto;line-height:0;box-shadow:0 9px 30px #0009}
.share-preview canvas{width:100%;height:auto;aspect-ratio:9/16;display:block}
.share-export{display:block;width:100%;min-height:54px;background:#d47a26;border-color:#ff9d42;color:#fff;font-size:17px}
.share-note{font-size:12px;color:#afc0ce;line-height:1.4;margin:11px 0 0}

.stats-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0 17px}
.stats-nav button{min-width:0;padding:10px 3px;font-size:14px}
.stats-nav button[aria-pressed=true],.progress-metrics button[aria-pressed=true]{border-color:var(--orange);background:#433223;color:#ffd2a8}
.progress-card{padding:13px;margin:10px 0}
.progress-heading{display:flex;align-items:baseline;justify-content:space-between;gap:7px;flex-wrap:wrap}
.progress-heading h3{margin:0}.progress-heading small{font-size:12px}
.progress-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:10px 0 12px}
.progress-metrics button{min-width:0;text-align:left;padding:8px;min-height:44px;font-size:13px}
.progress-metrics small{display:block;margin-top:3px;font-size:11px;color:inherit;font-weight:500}
.progress-card .tile{padding:9px}.progress-card .tile .big{font-size:20px;margin-top:3px}
.progress-range{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.progress-comparison{border-top:1px solid var(--line);padding:8px 0;font-size:13px;line-height:1.4}
.progress-comparison p{margin:0 0 3px}.progress-card .journal-action{margin:5px 0 0}
.progress-empty{font-size:13px;margin:7px 0 0}
.exercise-history-row{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;text-align:left;margin:6px 0;padding:9px;font-size:14px}
.exercise-history-row small{font-weight:500;color:var(--dim)}

<script>
'use strict';
const EX=[['doubles','Jorden rundt – doubler','D1 til D20. Registrer hver pil. RAMT går straks videre.'],['singles','Store singler','S1 til S20. To træffere i samme single i én indgang.'],['scoring','Scoring 20','Under 60 = 0, 60–99 = 1, 100–139 = 2, 140–179 = 3, 180 = 4. Saml 20 point.'],['checkout','Lukninger 60–69 (gammel historik)','Den gamle øvelse: ét besøg med tre pile fra 60 til 69.'],['catch40','Catch40 – 61–100','40 lukninger, én ad gangen fra 61 til 100. Højst 6 pile pr. lukning. 2 pile = 3 point, 3 pile = 2 point, 4–6 pile = 1 point. 99 i 3 pile giver 3 point.'],['checkout6080','Catch40 – kort 60–80','Kort variant af Catch40-reglerne: 21 lukninger, fra 60 til 80, højst 6 pile pr. lukning. Egen statistik; ikke det klassiske Catch40-resultat.'],['combos','Double-kombinationer','5 runder med fire indgange: D20–D10–D5, D16–D8–D4, D12–D6–D3 og D8–D4–D2. Én pil på hver double.'],['501','501 – 5 legs','Spil 5 legs fra 501. Tast scoren med store knapper, og registrér 0–3 doubleforsøg pr. indgang.']];
EX.push(['resultlog','Registreret øvelsesresultat','Samlet resultat fra en færdig træning.'],['jdc','JDC Challenge','Tre pile på hvert tal fra 10–15, én på hver double og bull, og dernæst tre pile på hvert tal fra 15–20.'],
 ['170','170 Challenge','Spil fem legs fra 170. Hvert leg slutter på en double eller bull.'],
 ['501cpu','501 mod CPU','Spil bedst af fem legs fra 501 med double-out. Du starter første leg, og derefter skifter I til at starte. Først til tre vinder.'],
 ['170cpu','170 mod CPU','Du starter. I spiller hver jeres indgange fra 170. Appen spiller CPU’ens tur, når du gemmer din. Bedst af 7 legs – først til 4 vundne. Du starter hvert leg.'],
 ['121','121 Challenge','Spil 10 runder med op til 9, 12 eller 15 pile. Start på 121, og gå ét tal op ved lukning. En lukning på tre pile låser tallet. Bust afslutter runden med det samme. Ved miss eller bust starter næste runde på det låste tal.'],
 ['501log','501 – hurtigregistrering','Gem totalsummen fra en træning, du allerede har spillet.']);
const LEGACY_EX_IDS=['doubles','singles','scoring','checkout','combos','501'];
const CHECKOUT_121_ROUNDS=10, CHECKOUT_121_LIMITS=[9,12,15], PLAN_VERSION=7;
const CATCH_RANGES={catch40:[61,100],checkout6080:[60,80]};
const KEY='HESTENG_TRAIN_V8',OLD_KEY='HESTENG_TRAIN_V7',EARLIER_KEY='HESTENG_TRAIN_V6',COMBOS=[[20,10,5],[16,8,4],[12,6,3],[8,4,2]];
const fresh=()=>({version:8,step:0,results:{},history:[],startedAt:null,plan:null,planName:null,focus:null,planDate:null,planVersion:PLAN_VERSION,status:'ready',inBreak:false,breakUntil:null,stepStartedAt:null,exerciseSeconds:{}});
let state=fresh(),tab='train',selectedExercise='doubles',storageOk=true,notice='';
function safeString(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function copy(v){return JSON.parse(JSON.stringify(v));}
function validEvents(id, a) {
 if (!Array.isArray(a) || a.length > 10000) return false;
 if (CATCH_RANGES[id]) return a.every(v=>Number.isInteger(v)&&(v===0||(v>=2&&v<=6))) && a.length<=CATCH_RANGES[id][1]-CATCH_RANGES[id][0]+1;
 if (id === '121') return a.length<=CHECKOUT_121_ROUNDS && a.every(e=>e&&CHECKOUT_121_LIMITS.includes(e.limit)&&e.limit===a[0].limit&&Number.isInteger(e.darts)&&(e.darts===0||(e.darts>=2&&e.darts<=e.limit)));
 if (id === 'resultlog') return a.length<=1 && a.every(validResultLog);
 if (id === '501log') return a.length<=1 && a.every(validQuick501);
 if (id === 'jdc') return a.length<=JDC_TARGETS.length && a.every((v,i)=>Number.isInteger(v)&&v>=0&&(JDC_TARGETS[i].double?v===0||v===JDC_TARGETS[i].points:v<=9*JDC_TARGETS[i].number||v===100+6*JDC_TARGETS[i].number));
 if (id === '501cpu') return !!cpu501Match(a);
 if (id === '170cpu') return validCpu170Events(a);
 if (id === '170' || id === '501') return a.every(validScoredVisit);
 if (id === 'singles' || id === 'checkout') return a.every(e=>Number.isInteger(e)&&e>=0&&e<=3);
 return a.every(e => Number.isInteger(e) && (id === 'scoring' ? e >= 0 && e <= 4 : e === 0 || e === 1));
}
function validScoredVisit(e){
 return e && typeof e==='object' && Number.isInteger(e.score) && e.score>=0 && e.score<=180 &&
  Number.isInteger(e.darts) && e.darts>=1 && e.darts<=3 && typeof e.finish==='boolean' &&
  (e.thrown===undefined||(e.bust===true&&!e.finish&&Number.isInteger(e.thrown)&&e.thrown>=Math.max(1,e.doubleAttempts??0)&&e.thrown<=e.darts)) &&
  (e.doubleAttempts===undefined||(Number.isInteger(e.doubleAttempts)&&e.doubleAttempts>=0&&
   e.doubleAttempts<=e.darts&&(!e.finish||e.doubleAttempts>=1)));
}
function validCpu170Events(events){
 if(events[0]?.bestOf===7)return !!cpu501Match(events,170,4);
 let player=170,cpu=170;
 for(const turn of events){
  if(!player||!cpu||!validScoredVisit(turn)||!Object.hasOwn(CPU_170_LEVELS,turn.level)||turn.level!==events[0].level)return false;
  player-=turn.score;
  if(player<0||player===1||turn.finish!==(player===0))return false;
  if(turn.finish){if(turn.cpu!==null)return false;continue;}
  if(!validScoredVisit(turn.cpu))return false;
  cpu-=turn.cpu.score;
  if(cpu<0||cpu===1||turn.cpu.finish!==(cpu===0))return false;
 }
 return true;
}
function validResults(results) {
 return results && typeof results === 'object' && !Array.isArray(results) &&
  EX.every(([id]) => !Object.hasOwn(results,id) || (results[id] && validEvents(id, results[id].events) && validCheckoutProgress(id,results[id])));
}
// V8.2 stores new sessions separately from v7.4. Old files and old localStorage are read-only.
// Old v8 backups are compatible. No existing records are rewritten.
const MAX_SESSION_MS=90*60*1000, BREAK_MS=5*60*1000;
// Estimates are provisional until this phone has measured completed exercises.
const DEFAULT_MINUTES={doubles:25,singles:14,scoring:15,catch40:25,checkout6080:15,combos:12,'501':30,'501cpu':40,jdc:18,'170':24,'170cpu':10,'121':22};
const PROGRAMS=[
 {name:'Scoring og kamp',plan:['scoring','170','501'],skills:['scoring','501']},
 {name:'Præcision og doubler',plan:['doubles','jdc'],skills:['doubles','scoring']},
 {name:'Lukninger under pres',plan:['121','combos','501'],skills:['doubles','501']},
 {name:'Scoring og checkout',plan:['jdc','170cpu','501'],skills:['scoring','501']},
 {name:'Doubler og variation',plan:['doubles','checkout6080'],skills:['doubles']}
];
function minutesFor(id,history){
 const measured=(history||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))
  .filter(h=>completedGame(id,h.results?.[id]))
  .map(h=>h.exerciseSeconds?.[id]).filter(n=>Number.isFinite(n)&&n>=60&&n<=MAX_SESSION_MS/1000)
  .slice(0,8).sort((a,b)=>a-b);
 if(!measured.length)return DEFAULT_MINUTES[id];
 const m=Math.floor(measured.length/2);
 return (measured.length%2?measured[m]:(measured[m-1]+measured[m])/2)/60;

function activeMinutes(plan,history){return Math.round(plan.reduce((s,id)=>s+minutesFor(id,history),0));}

function setScore501(field,value,preset=false){

function scoreTap501(key){

function currentScoredRest(){

function scoreEntryState(){
 const rest=currentScoredRest();
 const raw=document.getElementById('score501')?.value.trim()??'',score=Number(raw);
 const valid=raw!==''&&Number.isInteger(score)&&score>=0&&score<=180;
 const remaining=rest-score;
 const bust=valid&&(remaining<0||remaining===1);
 const finish=valid&&!bust&&remaining===0;
 const allowed=finish?[1,2,3].filter(darts=>checkoutRoute(rest,darts)):[];
 const darts=finish?Number(document.getElementById('darts501').value):3;
 const prompt=rest<=DOUBLE_PROMPT_REST||(valid&&!bust&&(finish?allowed.length>0:remaining<=DOUBLE_PROMPT_REST));
 const minAttempts=finish?1:0, maxAttempts=finish&&darts?darts:3;
 const value=document.getElementById('double501').value;
 const attempts=value===''?null:Number(value);
 const attemptsReady=attempts!==null&&Number.isInteger(attempts)&&attempts>=minAttempts&&attempts<=maxAttempts;
 const ready=valid&&!bust&&(!finish||allowed.includes(darts))&&(!prompt||attemptsReady);
 return {raw,score,rest,remaining,valid,bust,finish,allowed,darts,prompt,attempts,minAttempts,maxAttempts,attemptsReady,ready};
}
function update501Preview(){
 if(!document.getElementById('score501'))return;
 const x=scoreEntryState();
 const is121=activeExerciseId()==='121';
 document.getElementById('finish501Controls').hidden=!x.allowed.length;
 for(const d of [1,2,3])document.getElementById('finishDarts501-'+d).disabled=!x.allowed.includes(d);
 document.getElementById('double501Controls').hidden=!x.prompt;
 if(!x.prompt||!x.attemptsReady){
  document.getElementById('double501').value='';
  select501([0,1,2,3].map(v=>'doubleTry501-'+v),-1);
 }
 for(const a of [0,1,2,3])document.getElementById('doubleTry501-'+a).disabled=a<x.minAttempts||a>x.maxAttempts;
 document.getElementById('score501Preview').textContent=!x.valid?(x.raw?'Indtast et tal fra 0 til 180.':'Tast score og gem indgangen.'):
  x.bust?(is121?(x.prompt&&!x.attemptsReady?'Bust. Vælg antal doubleforsøg først.':'Bust. Vælg antal pile for at afslutte runden.'):'Bust. Resten bliver '+x.rest+'.'):
  x.finish&&!x.allowed.length?'Den rest kan ikke lukkes på tre pile.':
  x.finish&&!x.allowed.includes(x.darts)?'Vælg pilen, du lukkede på.':
  is121&&x.prompt&&!x.attemptsReady?'Vælg antal doubleforsøg for at gemme.':
  x.finish?'Lukning på '+x.darts+(x.darts===1?' pil.':' pile.'):
  x.rest+' − '+x.score+' = '+x.remaining+' tilbage.';
 const button=document.getElementById('save501');
 const registeringBust=is121&&x.bust;
 button.disabled=registeringBust?(x.prompt&&!x.attemptsReady):!x.ready;
 button.textContent=registeringBust?'Vælg pile ved bust':x.finish?'Gem lukning':'Gem indgang';
 const bustButton=document.getElementById('bust501');

function add501(){

  if((!x.prompt||x.attemptsReady)&&document.getElementById('bustDarts501').hidden)toggleBustDarts();
  return;

}
function toggleBustDarts(){

function bust501(thrown){
 const x=scoreEntryState();
 if(!Number.isInteger(thrown)||thrown<Math.max(1,x.attempts??0)||thrown>3)return;
 if(x.rest<=DOUBLE_PROMPT_REST&&!x.attemptsReady)return;
 // A bust consumes the visit for scoring, while the training total uses throws made.
 saveScoredVisit({score:0,finish:false,darts:3,thrown,bust:true,doubleAttempts:x.prompt?(x.attempts??0):0});
}

function archiveRecords(parsed){
 const format=parsed?.format;
 const incoming=parsed?.state??parsed;
 const version=archiveVersion(format,incoming);
 const valid=version===8?validV8State(incoming):validV7State(incoming);
 if(!valid)throw new Error('Sikkerhedskopien mangler gyldige træningsdata.');
 const records=incoming.history.slice();
 const unfinished=importedPartial(incoming);
 if(unfinished)records.push(unfinished);
 return records;
}
function archiveVersion(format,incoming){
 if(format==='HESTENG-MOBILE-V7')return 7;
 if(format==='HESTENG-MOBILE-V8'||format==='DART-TRAINING-V1')return 8;
 if(!format)return incoming?.version===8?8:7;

}
function sortedBackupValue(value){
 if(Array.isArray(value))return value.map(sortedBackupValue);
 if(value&&typeof value==='object'){
  return Object.fromEntries(Object.keys(value).sort().map(key=>[key,sortedBackupValue(value[key])]));
 }
 return value;
}
function archiveResultKey(record){
 const events=Object.entries(record.results)
  .filter(([,result])=>Array.isArray(result?.events)&&result.events.length)
  .map(([exercise,result])=>[exercise,result.events]);
 return JSON.stringify(sortedBackupValue(Object.fromEntries(events)));
}
function mergeArchiveRecords(records){
 const ids=new Set();
 const resultKeys=new Set();
 const sessionKeys=new Set();
 function keys(record){
  const results=archiveResultKey(record);
  const startedAt=Date.parse(record.startedAt);
  return {
   date:JSON.stringify([Date.parse(record.date),results]),
   session:Number.isFinite(startedAt)?JSON.stringify([startedAt,results]):null
  };
 }
 function remember(record,key){
  if(record.id)ids.add(JSON.stringify([record.id,archiveResultKey(record)]));
  resultKeys.add(key.date);
  if(key.session)sessionKeys.add(key.session);
 }
 for(const record of state.history)remember(record,keys(record));
 const active=state.status==='active'&&existingEntries(state.results)?
  keys({date:state.startedAt,startedAt:state.startedAt,results:state.results}).session:null;
 const added=[];
 for(const record of records){
  const key=keys(record);
  const localActiveDuplicate=record.status==='partial'&&active&&key.session===active;
  if(localActiveDuplicate||(record.id&&ids.has(JSON.stringify([record.id,archiveResultKey(record)])))||resultKeys.has(key.date)||(key.session&&sessionKeys.has(key.session)))continue;
  added.push(record);
  remember(record,key);
 }

}
function importSummary(added,duplicates){
 const partial=added.filter(record=>record.status==='partial').length;
 const dates=added.map(record=>Date.parse(record.date)).sort((a,b)=>a-b);
 const range=dates.length?(day(dates[0])===day(dates.at(-1))?day(dates[0]):day(dates[0])+' – '+day(dates.at(-1))):'';
 return `${added.length} nye træninger (${partial} afbrudte)${range?' · '+range:''} · ${duplicates} dubletter sprunget over.`;
}
async function importArchive(input){

 try{
  if(file.size>4000000)throw new Error('Filen er for stor (maks. 4 MB).');
  const contents=await file.text().catch(()=>{throw new Error('Filen kunne ikke læses. Vælg den igen.');});
  let parsed;
  try{parsed=JSON.parse(contents);}
  catch(e){throw new Error('Filen kunne ikke læses som JSON. Vælg den oprindelige sikkerhedskopi.');}
  request.records=archiveRecords(parsed);
 }catch(e){request.error=e.message;}
