<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jyden Klubaften</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #edf2ed;
      --surface: #fbfdfb;
      --ink: #172a21;
      --muted: #4a6257;
      --line: #d6e2d8;
      --green: #163b2e;
      --accent: #d2f68b;
      --soft: #e6f0e7;
      font: 1rem/1.5 'Instrument Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    main { max-width: 42rem; margin: 0 auto; padding: clamp(0rem, 3vw, 1.5rem) 0 2rem; }
    h1, h2, h3, p { margin: 0; }
    button, select { min-height: 2.75rem; font: inherit; color: inherit; }
    button, summary { cursor: pointer; }
    :focus-visible { outline: 3px solid #438255; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .hero {
      position: relative; isolation: isolate; overflow: hidden; padding: 1.6rem clamp(1.1rem, 5vw, 2rem);
      border-radius: 1.25rem 1.25rem 0 0; background: #102d25; color: #f5faef;
      display: flex; align-items: end; justify-content: space-between; gap: .5rem;
    }
    .hero::after {
      content: ''; position: absolute; z-index: -1; inset: -4rem -2rem auto auto;
      width: 18rem; aspect-ratio: 1; border-radius: 50%; opacity: .36;
      background: radial-gradient(circle, #c9f479 0 4%, #568066 4.5% 6%, transparent 6.5% 26%,
        #a0c39c 26.5% 27%, transparent 27.5% 31%, #a0c39c 31.5% 32%,
        transparent 32.5% 62%, #a0c39c 62.5% 63%, transparent 63.5%),
        repeating-conic-gradient(from 9deg, #789e7844 0deg 1deg, #3c614d 1deg 18deg, #1f4236 19deg 36deg);
      mask-image: linear-gradient(275deg, #000 30%, transparent 100%);
    }
    .club { display: flex; align-items: center; gap: .55rem; font-weight: 650; font-size: .875rem; }
    .mark {
      display: grid; place-items: center; width: 1.65rem; height: 1.65rem;
      border: 1px solid var(--accent); border-radius: 50%; color: var(--accent);
    }
    h1 { margin-top: .38rem; font-size: clamp(2rem, 8vw, 3.35rem); line-height: 1.08; letter-spacing: -.055em; }
    h2 { font-size: 1.35rem; line-height: 1.25; letter-spacing: -.025em; }
    h3 { font-size: 1rem; }
    .quiet { color: var(--muted); }
    .sub { color: #d5e8db; margin-top: .3rem; font-size: .875rem; }
    .refresh {
      flex-shrink: 0; border: 1px solid #a3c1af; border-radius: .55rem;
      background: #123c2f; color: #f5faef; padding: .4rem .65rem; font-size: .875rem;
    }
    button:disabled { cursor: default; opacity: .63; }
    .content { padding: 1rem clamp(1rem, 4vw, 1.7rem); }
    .views {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: .25rem; padding: .25rem;
      border: 1px solid var(--line); border-radius: .8rem; background: #e3ebe3; margin-bottom: 1rem;
    }
    .views button { background: transparent; border: 1px solid transparent; border-radius: .57rem; font-weight: 650; }
    .views button[aria-pressed="true"] { color: var(--green); background: var(--surface); border-color: var(--line); }
    .panel, details {
      background: var(--surface); border: 1px solid var(--line); border-radius: .9rem;
    }
    .panel { padding: 1rem; }
    .panel > p + p { margin-top: .5rem; }
    .stack { display: grid; gap: .6rem; }
    .field { display: grid; gap: .35rem; font-weight: 650; }
    select {
      max-width: 100%; padding: .35rem .65rem; background: var(--surface);
      border: 1px solid #9db3a2; border-radius: .5rem; font-weight: 500;
    }
    #player { width: 100%; }
    #personalProgram { margin-top: .75rem; }
    .poolHeader {
      display: grid; grid-template-columns: 2.4rem 1fr auto .5rem;
      align-items: center; gap: .65rem; padding: .6rem .85rem; min-height: 3.65rem; list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    .letter {
      display: grid; place-items: center; min-height: 2.4rem;
      background: var(--soft); color: var(--green); font-weight: 750; border-radius: .52rem;
    }
    .poolName { font-weight: 700; }
    .count { font-size: .875rem; color: var(--muted); }
    .chevron { width: .47rem; height: .47rem; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); }
    details[open] .chevron { transform: rotate(225deg); }
    .poolBody { padding: .2rem .85rem 1rem; }
    .roster {
      padding: .65rem .7rem; margin: 0 0 .8rem; list-style: none;
      display: flex; flex-wrap: wrap; gap: .25rem .75rem; background: var(--soft); border-radius: .5rem;
      font-size: .9rem;
    }
    .roster li { overflow-wrap: anywhere; }
    .rounds { list-style: none; padding: 0; margin: .5rem 0 0; }
    .rounds > li { border-top: 1px solid var(--line); padding: .55rem 0; }
    .rounds > li:last-child { padding-bottom: 0; }
    .rounds h3 { color: var(--green); font-size: .875rem; margin-bottom: .2rem; }
    .rounds ul { margin: 0; padding: 0; list-style: none; overflow-wrap: anywhere; }
    .rounds ul li + li { margin-top: .18rem; }
    .personal .rounds > li { display: grid; grid-template-columns: 4.7rem 1fr; gap: .4rem; align-items: baseline; }
    .personal .rounds h3 { margin-bottom: 0; }
    .editor { margin: .9rem 0; display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; }
    .editor button {
      border: 1px solid var(--green); border-radius: .5rem; background: var(--green); color: #fff;
      padding: .35rem .8rem; font-weight: 650;
    }
    .status { margin: 0 0 .8rem; color: var(--muted); font-size: .875rem; }
    .status:empty { display: none; }
    @media (max-width: 40rem) { .hero { border-radius: 0; } }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <p class="club"><span class="mark" aria-hidden="true">J</span> Jyden Dart</p>
        <h1>Klubaften</h1>
        <p class="sub" id="overview" hidden></p>
      </div>
      <button type="button" class="refresh" id="refresh">Opdatér</button>
    </header>
    <div class="content">
      <p class="status" id="status" role="status">Henter puljer og kampprogram…</p>
      <nav class="views" id="views" aria-label="Klubaften" hidden>
        <button type="button" id="myView" aria-controls="personal" aria-pressed="true">Min aften</button>
        <button type="button" id="allView" aria-controls="all" aria-pressed="false">Alle puljer</button>
      </nav>
      <section id="personal" aria-label="Min aften" hidden>
        <div class="panel">
          <label class="field" for="player">Dit navn</label>
          <select id="player"></select>
        </div>
        <div class="panel personal" id="personalProgram" hidden></div>
      </section>
      <section id="all" aria-label="Alle puljer" class="stack" hidden></section>
    </div>
  </main>
  <script>
    const nodes = Object.fromEntries(
      ['refresh', 'overview', 'status', 'views', 'myView', 'allView', 'personal', 'all', 'player', 'personalProgram']
        .map(id => [id, document.getElementById(id)])
    );
    let night;
    let isPersonal = true;
    let saving = false;

    function element(tag, content, className) {
      const node = document.createElement(tag);
      if (content) node.textContent = content;
      if (className) node.className = className;
      return node;
    }

    function showView(personal) {
      isPersonal = personal;
      const hasPools = Boolean(night?.pools.length);
      nodes.views.hidden = !hasPools;
      nodes.personal.hidden = !hasPools || !personal;
      nodes.all.hidden = !hasPools || personal;
      nodes.myView.setAttribute('aria-pressed', String(personal));
      nodes.allView.setAttribute('aria-pressed', String(!personal));
    }

    function renderProgram(rounds, player) {
      const list = element('ol', '', 'rounds');
      list.setAttribute('role', 'list');
      rounds.forEach((round, index) => {
        const matches = player ? round.filter(match => match.includes(player)) : round;
        if (!matches.length) return;
        const row = element('li');
        const games = element('ul');
        games.setAttribute('role', 'list');
        for (const [first, second] of matches) {
          games.append(element('li', player ? (first === player ? second : first) : first + ' mod ' + second));
        }
        row.append(element('h3', 'Runde ' + (index + 1)), games);
        list.append(row);
      });
      return list;
    }

    function renderPersonal() {
      const player = nodes.player.value;
      const pool = night?.pools.find(item => item.players.includes(player));
      nodes.personalProgram.hidden = !pool;
      if (!pool) return;
      const count = pool.rounds.flat().filter(match => match.includes(player)).length;
      nodes.personalProgram.replaceChildren(
        element('h2', pool.name),
        element('p', count + (count === 1 ? ' kamp' : ' kampe'), 'quiet'),
        renderProgram(pool.rounds, player)
      );
    }

    function boardEditor(pool) {
      const form = element('form', '', 'editor');
      const label = element('label', 'Antal baner', 'field');
      const select = element('select');
      select.name = 'boardCount';
      for (const count of [2, 3]) select.append(new Option(count + ' baner', String(count)));
      select.value = String(pool.boardCount);
      label.append(select);
      const button = element('button', 'Gem');
      button.type = 'submit';
      form.append(label, button);
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (saving || nodes.refresh.disabled) return;
        saving = true;
        button.disabled = true;
        select.disabled = true;
        nodes.refresh.disabled = true;
        nodes.status.textContent = 'Gemmer…';
        google.script.run.withSuccessHandler(updated => {
          night.pools = night.pools.map(item => item.name === updated.name ? updated : item);
          saving = false;
          nodes.refresh.disabled = false;
          renderAll();
          renderPersonal();
          nodes.status.textContent = updated.name + ' er opdateret.';
          const openPool = [...nodes.all.querySelectorAll('details[open]')]
            .find(item => item.dataset.pool === updated.name);
          openPool?.querySelector('select')?.focus();
        }).withFailureHandler(error => {
          saving = false;
          select.disabled = false;
          button.disabled = false;
          nodes.refresh.disabled = false;
          nodes.status.textContent = error?.message || 'Kunne ikke gemme. Prøv igen.';
        }).saveJydenBoardCount(pool.name, Number(select.value), night.revision);
      });
      return form;
    }

    function renderAll() {
      const open = nodes.all.querySelector('details[open]')?.dataset.pool;
      nodes.all.replaceChildren();
      for (const pool of night.pools) {
        const details = element('details');
        details.name = 'jyden-pools';
        details.dataset.pool = pool.name;
        details.open = pool.name === open;
        const summary = element('summary', '', 'poolHeader');
        const letter = element('span', pool.name.slice(6), 'letter');
        const chevron = element('span', '', 'chevron');
        letter.setAttribute('aria-hidden', 'true');
        chevron.setAttribute('aria-hidden', 'true');
        summary.append(letter, element('span', pool.name, 'poolName'),
          element('span', pool.players.length + ' spillere', 'count'), chevron);
        const body = element('div', '', 'poolBody');
        const roster = element('ul', '', 'roster');
        roster.setAttribute('aria-label', 'Spillere');
        roster.setAttribute('role', 'list');
        for (const player of pool.players) roster.append(element('li', player));
        body.append(roster);
        if (night.canEdit) body.append(boardEditor(pool));
        body.append(element('h2', 'Kampprogram'), renderProgram(pool.rounds));
        details.append(summary, body);
        nodes.all.append(details);
      }
    }

    function loadNight() {
      if (saving) return;
      nodes.refresh.disabled = true;
      nodes.status.textContent = 'Henter puljer og kampprogram…';
      google.script.run.withSuccessHandler(data => {
        night = data;
        const selected = nodes.player.value;
        const players = [...new Set(night.pools.flatMap(pool => pool.players))]
          .sort((a, b) => a.localeCompare(b, 'da'));
        nodes.player.replaceChildren(new Option('Vælg dit navn', ''),
          ...players.map(player => new Option(player, player)));
        nodes.player.value = players.includes(selected) ? selected : '';
        nodes.overview.hidden = !night.pools.length;
        nodes.overview.textContent = night.pools.length + (night.pools.length === 1 ? ' pulje' : ' puljer') +
          ' · ' + players.length + ' spillere';
        renderAll();
        renderPersonal();
        showView(isPersonal);
        nodes.status.textContent = night.unavailable.length
          ? 'Kunne ikke læse ' + night.unavailable.join(', ') + '.'
          : night.pools.length ? '' : 'Der er endnu intet kampprogram i Legacy.';
        nodes.refresh.disabled = false;
      }).withFailureHandler(() => {
        nodes.status.textContent = night
          ? 'Kunne ikke opdatere. Det senest hentede program vises.'
          : 'Kunne ikke hente kampprogrammet. Tjek din adgang til arket, og prøv igen.';
        nodes.refresh.disabled = false;
      }).getJydenNight();
    }

    nodes.myView.addEventListener('click', () => showView(true));
    nodes.allView.addEventListener('click', () => showView(false));
    nodes.player.addEventListener('change', renderPersonal);
    nodes.refresh.addEventListener('click', loadNight);
    loadNight();
  </script>
</body>
</html>
