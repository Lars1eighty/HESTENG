name: HESTENG Tests

env:
  DATABASE_URL: postgresql://hesteng:hesteng@127.0.0.1:5432/hesteng_test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hesteng-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hesteng-web/package-lock.json
      - name: Install
        run: npm install
      - name: Regression tests
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hesteng-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hesteng-web/package-lock.json
      - name: Install
        run: npm install
      - name: Install browser
        run: npx --yes --package=@playwright/test@1.55.0 playwright install --with-deps chromium
      - name: Build HESTENG
        run: npx next build
      - name: Start HESTENG
        run: npm run start > /tmp/hesteng.log 2>&1 &
      - name: Wait for HESTENG
        run: npx --yes wait-on@8.0.4 http://127.0.0.1:3000
      - name: Browser smoke test
        run: npx --yes --package=@playwright/test@1.55.0 playwright test tests/e2e/club-night.smoke.spec.js --reporter=line
