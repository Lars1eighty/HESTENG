name: HESTENG Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hesteng-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hesteng-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Regression tests
        run: npm test
